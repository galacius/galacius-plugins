name: CD

on:
  push:
    branches:
      - master

jobs:
  release-version:
    name: Release Version
    uses: ./.github/workflows/job-release-semver.yml
    secrets: inherit

  # Adding a new plugin: add its own `build-<id>` job below (mirroring build-helm)
  # and list it in publish-plugin-registry's `needs:` — job-build.yml handles change
  # detection internally (skipping its own build when plugins/<id>/** etc. are
  # unchanged), and the registry job discovers per-plugin manifests uploaded as
  # workflow artifacts by naming convention, so no other change is needed for a
  # new plugin to be picked up.
  build-helm:
    name: Build Helm Plugin
    needs: [release-version]
    if: ${{ needs.release-version.result == 'success' }}
    uses: ./.github/workflows/job-build.yml
    secrets: inherit
    with:
      plugin_id: helm
      plugin_name: Helm
      plugin_description: Manage Helm charts and releases in your Kubernetes clusters
      plugin_homepage: https://helm.sh
      plugin_capabilities: helm-charts,helm-releases
      plugin_binary_name: plugin-helm
      version: ${{ needs.release-version.outputs.tag_name }}
      minimumHostVersion: "1.1.0"

  build-resources-monitor:
    name: Build Resources Monitor Plugin
    needs: [release-version]
    if: ${{ needs.release-version.result == 'success' }}
    uses: ./.github/workflows/job-build.yml
    secrets: inherit
    with:
      plugin_id: resources-monitor
      plugin_name: Resources Monitor
      plugin_description: Live monitoring CPU, memory and disk I/O usage for the application
      plugin_homepage: https://github.com/galacius/galacius-plugins/tree/master/plugins/resources-monitor
      plugin_capabilities: host-metrics
      plugin_binary_name: plugin-resources-monitor
      version: ${{ needs.release-version.outputs.tag_name }}
      minimumHostVersion: "1.1.0"

  publish-plugin-registry:
    name: Publish Plugin Registry Manifest
    needs: [release-version, build-helm, build-resources-monitor]
    if: ${{ always() && needs.release-version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download per-plugin manifests
        # Per-plugin manifests are internal hand-offs from job-build.yml's
        # `manifest` job (uploaded as workflow artifacts, galacius-plugin-<id>-
        # manifest.json), never published as release assets — this repo's only
        # user/installer-facing plugin-manifest file is the aggregate
        # manifest.json built below.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: galacius-plugin-*-manifest.json
          path: plugin-manifests
          merge-multiple: true

      - name: Build manifest.json from downloaded per-plugin manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-version.outputs.tag_name }}"
          REPO="${{ github.repository }}"

          mkdir -p baseline plugin-manifests

          # Find the most recent prior release that already published a registry
          # manifest.json, and use it as a baseline. Plugins whose build was
          # skipped this round (no relevant changes, see detect-*-changes above)
          # keep their last-known entry instead of dropping out of the registry
          # for this release.
          baseline_tag=""
          for t in $(gh release list --repo "$REPO" --limit 20 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName'); do
            [[ "$t" == "$TAG" ]] && continue
            if gh release view "$t" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx "manifest.json"; then
              baseline_tag="$t"
              break
            fi
          done

          if [[ -n "$baseline_tag" ]]; then
            echo "Using baseline registry manifest from release $baseline_tag"
            gh release download "$baseline_tag" --repo "$REPO" --pattern manifest.json --dir baseline --clobber
            cp baseline/manifest.json manifest.json
          else
            echo "No prior registry manifest found — starting fresh"
            echo '{"generated_at": "", "release_tag": "", "plugins": []}' > manifest.json
          fi

          # Upsert this release's freshly built plugin manifests by id, leaving
          # any plugin not rebuilt this round untouched from the baseline above.
          # Per-plugin manifests were fetched into plugin-manifests/ by the
          # "Download per-plugin manifests" step above — every plugin that
          # published one this round gets picked up here automatically. A
          # plugin whose build was skipped this round (no relevant changes)
          # has no file here and simply keeps its baseline entry.
          shopt -s nullglob
          for manifest_file in plugin-manifests/galacius-plugin-*-manifest.json; do
            manifest=$(jq --slurpfile plugin "$manifest_file" \
              '($plugin[0].id) as $id | .plugins = ([.plugins[] | select(.id != $id)] + [$plugin[0]])' \
              manifest.json)
            echo "$manifest" > manifest.json
          done

          # Stamp metadata for this release
          manifest=$(jq --arg tag "$TAG" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.release_tag = $tag | .generated_at = $now' manifest.json)
          echo "$manifest" > manifest.json

          cat manifest.json

      - name: Carry forward release assets for skipped plugins
        # A plugin whose build was skipped this round (see comment above) keeps its
        # manifest entry from the baseline release, but that baseline entry's
        # checksums point at asset files (binaries, frontend bundle, logo) that only
        # exist on whichever release actually built them — job-build.yml only
        # uploads those when it actually rebuilds a plugin. The baseline release
        # used for the manifest.json *content* is not necessarily that release: it
        # may itself be a skip-round release that only carried forward the JSON
        # entry (e.g. it was published before this asset-carry-forward step
        # existed, or every release since the real build was itself a skip).
        # So, per plugin, walk releases newest-to-oldest independently and use the
        # first one that actually has that plugin's asset files, however far back
        # that is. Without this step, this release would ship a manifest.json
        # referencing assets that 404 on its own page.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.release-version.outputs.tag_name }}"
          REPO="${{ github.repository }}"

          releases=$(gh release list --repo "$REPO" --limit 50 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName')

          shopt -s nullglob
          for id in $(jq -r '.plugins[].id' manifest.json); do
            if [[ -f "plugin-manifests/galacius-plugin-${id}-manifest.json" ]]; then
              continue # rebuilt this round, its own assets were already uploaded
            fi

            source_tag=""
            for t in $releases; do
              [[ "$t" == "$TAG" ]] && continue
              if gh release view "$t" --repo "$REPO" --json assets --jq '.assets[].name' | grep -qx "galacius-plugin-${id}-linux-amd64"; then
                source_tag="$t"
                break
              fi
            done

            if [[ -z "$source_tag" ]]; then
              echo "::error::No prior release found with asset files for plugin '$id' — cannot carry forward."
              exit 1
            fi

            echo "Copying forward release assets for plugin '$id' from $source_tag"
            logo_file=$(jq -r --arg id "$id" '.plugins[] | select(.id == $id) | .assets.logo // empty' manifest.json)

            assets=(
              "galacius-plugin-${id}-linux-amd64"
              "galacius-plugin-${id}-darwin-arm64"
              "galacius-plugin-${id}-windows-amd64.exe"
              "galacius-plugin-${id}-frontend.tar.gz"
            )
            if [[ -n "$logo_file" ]]; then
              assets+=("galacius-plugin-${id}-logo.${logo_file##*.}")
            fi

            mkdir -p "carry-forward/${id}"
            for asset in "${assets[@]}"; do
              gh release download "$source_tag" --repo "$REPO" --pattern "$asset" --dir "carry-forward/${id}" --clobber
              gh release upload "$TAG" "carry-forward/${id}/${asset}" --repo "$REPO" --clobber
            done
          done

      - name: Upload registry manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.release-version.outputs.tag_name }}"
          gh release upload "$TAG" manifest.json --repo "${{ github.repository }}" --clobber

  finalize-release:
    name: Finalize Release
    needs: [release-version, build-helm, build-resources-monitor, publish-plugin-registry]
    if: ${{ always() && needs.release-version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Finalize release by flipping draft to published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.release-version.outputs.tag_name }}" --repo "${{ github.repository }}" --draft=false
